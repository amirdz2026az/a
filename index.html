<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>مرحباً بك</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .box {
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }
        p {
            color: #666;
            line-height: 1.6;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✅ موقعك يعمل الآن بشكل صحيح!</h1>
        <p>تم حل مشكلة الصفحة البيضاء بنجاح</p>
        <p>هذا هو الحل الصحيح لـ GitHub Pages</p>
    </div>
</body>
</html>
